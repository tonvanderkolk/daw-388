[package]
name = "daw388"
description = "DAW 388 voor macOS en Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "daw388"
path = "src/main.rs"

[dependencies]
daw388-engine.workspace = true
rtrb.workspace = true
daw388-ui.workspace = true
daw388-project.workspace = true
cpal.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
dirs = "7"
# Unused recordings go to the Trash or Recycle Bin, never straight away.
trash = "5"

# Puts the icon into the Windows exe (build.rs); does nothing when building for macOS.
[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same version eframe uses; needed to switch off winit's default macOS menu.
winit = "0.30"

[lints]
workspace = true
