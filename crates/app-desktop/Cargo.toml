[package]
name = "daw388"
description = "DAW 388 voor macOS en Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "daw388"
path = "src/main.rs"

[dependencies]
daw388-engine.workspace = true
rtrb.workspace = true
daw388-ui.workspace = true
daw388-project.workspace = true
cpal.workspace = true
eframe.workspace = true
rfd.workspace = true
log.workspace = true
env_logger.workspace = true
dirs = "7"
# Unused recordings go to the Trash or Recycle Bin, never straight away.
trash = "5"
# The update check asks GitHub for the latest release (HTTPS with rustls).
ureq = "3"

# Puts the icon into the Windows exe (build.rs); does nothing when building for macOS.
[build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Same version eframe uses; needed to switch off winit's default macOS menu.
winit = "0.30"
# Opening a project from the Finder and the "save changes?" question when logging out: adds
# `application:openURLs:` and `applicationShouldTerminate:` to winit's app delegate.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["block2", "NSArray", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSView", "NSWindow"] }

# The workspace forbids unsafe code; here it is denied, so app_delegate.rs (the one place that
# talks to the Objective-C runtime) can allow it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
