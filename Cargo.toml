[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.29.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ton van der Kolk"]
repository = "https://github.com/tonvanderkolk/daw-388"
publish = false

[workspace.dependencies]
daw388-engine = { path = "crates/engine" }
daw388-tape = { path = "crates/tape" }
daw388-fx = { path = "crates/fx" }
daw388-project = { path = "crates/project" }
daw388-ui = { path = "crates/ui" }

rtrb = "0.4"
hound = "3.5"
symphonia = { version = "0.6", default-features = false, features = ["aiff", "pcm", "flac", "mp3", "id3v2"] }
cpal = "0.18"
egui = "0.37"
eframe = "0.37"
rfd = "0.17"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
rubato = "5"
env_logger = "0.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
