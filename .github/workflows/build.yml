name: build

# Elke push naar main en elke pull request: alleen een controle op Windows (opmaak, Clippy,
# tests). macOS wordt lokaal al bij elke wijziging gebouwd en getest, en een macOS-minuut telt
# op GitHub voor tien. Een versielabel (v0.7.0 en verder) of een handmatige start bouwt de
# release voor macOS en Windows, met downloadbare apps.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: daw388-macos-arm64
            binary: daw388
          - os: windows-latest
            artifact: daw388-windows-x64
            binary: daw388.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests draaien in het release-profiel, zodat de release-build daarna dezelfde
      # gecompileerde afhankelijkheden hergebruikt in plaats van alles opnieuw te bouwen.
      - name: Tests
        run: cargo test --workspace --release
      - name: Release-build
        run: cargo build --release -p daw388
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
