name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: daw388-macos-arm64
            binary: daw388
          - os: windows-latest
            artifact: daw388-windows-x64
            binary: daw388.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Tests draaien in het release-profiel, zodat de release-build daarna dezelfde
      # gecompileerde afhankelijkheden hergebruikt in plaats van alles opnieuw te bouwen.
      - name: Tests
        run: cargo test --workspace --release
      - name: Release-build
        run: cargo build --release -p daw388
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.binary }}
