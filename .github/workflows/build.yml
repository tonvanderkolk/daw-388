name: build

# Elke push naar main en elke pull request: alleen een controle op Windows (opmaak, Clippy,
# tests). macOS wordt lokaal al bij elke wijziging gebouwd en getest, en een macOS-minuut telt
# op GitHub voor tien. Een versielabel (v0.25.0 en verder) of een handmatige start bouwt de apps:
# een universal DMG voor macOS en een ZIP voor Windows; bij een versielabel komen ze in een
# GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  # Een versielabel of een handmatige start: de apps voor macOS (universal, Apple Silicon en
  # Intel, als DMG) en Windows (ZIP). Bij een versielabel komen ze daarna in een GitHub Release.
  macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --release
      - name: Release-builds (Apple Silicon en Intel)
        run: |
          cargo build --release -p daw388 --target aarch64-apple-darwin
          cargo build --release -p daw388 --target x86_64-apple-darwin
      - name: App en DMG, met de handleiding
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist
          packaging/manual.sh "$version" "dist/DAW-388-$version-manual.pdf"
          MANUAL="dist/DAW-388-$version-manual.pdf" packaging/macos/bundle.sh "$version" dist \
            target/aarch64-apple-darwin/release/daw388 \
            target/x86_64-apple-darwin/release/daw388
      - uses: actions/upload-artifact@v7
        with:
          name: daw388-macos
          path: |
            dist/*.dmg
            dist/*.pdf

  windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formattering
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --release
      - name: Release-build
        run: cargo build --release -p daw388
      - name: ZIP, met de handleiding
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p "dist/DAW 388"
          cp target/release/daw388.exe "dist/DAW 388/DAW 388.exe"
          packaging/manual.sh "$version" "dist/DAW 388/DAW 388 Manual.pdf"
          cp LICENSE-MIT LICENSE-APACHE "dist/DAW 388/"
          cd dist && 7z a "DAW-388-$version-windows.zip" "DAW 388" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: daw388-windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            **macOS** (Apple Silicon and Intel, macOS 11 or later): the first time takes one extra step.

            1. Open the DMG and drag DAW 388 to Applications.
            2. Start DAW 388. The app is not signed with an Apple Developer ID, so macOS says it could not verify it. Click **Done**, not "Move to Trash".
            3. Open System Settings, Privacy & Security, scroll down and click **Open Anyway** next to DAW 388. Confirm with your password.
            4. From then on DAW 388 opens normally.

            Comfortable with Terminal? This one command does the same and skips the warning:

            ```
            xattr -dr com.apple.quarantine "/Applications/DAW 388.app"
            ```

            **Windows** (64-bit): unzip and start `DAW 388.exe`. Windows SmartScreen may warn about an unknown publisher: choose "More info", then "Run anyway".

            **Manual**: the PDF below, also in the DMG and the ZIP, and in the app under Help, User manual.
